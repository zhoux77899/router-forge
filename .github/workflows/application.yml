name: Application

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: application-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Download Go dependencies
        run: go mod download
      - name: Check shared contracts
        run: bun run generate:contracts
      - name: Check generated files are current
        run: git diff --exit-code -- packages/api/openapi.json packages/api/src/schema.generated.ts
      - name: Check TypeScript
        run: bun run typecheck
      - name: Test frontend and API
        run: bun test
      - name: Test Go packages with mock providers and workers
        run: bun run test:go
      - name: Build read-only results
        run: bun run build:web
      - name: Build backend and worker resources
        run: bun run build:backend
      - name: Build native Desktop
        if: runner.os == 'Windows'
        run: bun run build:desktop
      - name: Test native bindings and production bundle without a GUI
        if: runner.os == 'Windows'
        env:
          ROUTER_FORGE_VERIFY_NATIVE_BUNDLE: '1'
          ROUTER_FORGE_NATIVE_BUNDLE_DIR: '${{ github.workspace }}\build\desktop\windows-amd64'
        run: go test .\apps\desktop\... -count=1 -timeout 120s
      - name: Check contribution tooling
        run: |
          node --check .githooks/commitlint.config.mjs
          node --check .githooks/check-commit-message.mjs
          git diff --check
