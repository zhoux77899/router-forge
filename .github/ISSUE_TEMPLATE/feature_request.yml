name: Feature request
description: Propose a change to routing control, evaluation, or repository tooling.
body:
  - type: markdown
    attributes:
      value: |
        Check existing issues for related proposals.
        Describe the intended behavior without including credentials or private data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what prevents it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you want and who would use it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe other approaches or workarounds you considered.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable result would show that the proposal works?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include related issues, examples, or scope boundaries.
    validations:
      required: false
